[project]
name = "claw-zero"
version = "0.1.0"
description = "A minimal, non-user-facing, self-owned, long-running agent loop. Humans and agents are equal peers."
requires-python = ">=3.12,<3.14"
dependencies = [
    # litellm is the ONLY runtime dependency: it is claw-zero's LLM client and
    # keeps the LiteLLM model-string format so Anthropic / OpenAI / Bedrock /
    # Vertex all work without any additional SDK. No cua-*, no Pillow.
    "litellm>=1.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
claw-zero = "claw_zero.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claw_zero"]

[tool.pytest.ini_options]
testpaths = ["claw_zero"]
# importlib mode: don't walk up through repo-root __init__.py (the legacy
# ale-claw deployer package) when importing claw_zero test modules.
addopts = "--import-mode=importlib"
