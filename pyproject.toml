[project]
name = "claw-zero"
version = "0.1.0"
description = "A minimal, non-user-facing, self-owned, long-running agent loop. Humans and agents are equal peers."
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=2.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
claw-zero = "claw_zero.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "claw_zero" = "." }
packages = [
    "claw_zero",
    "claw_zero.messaging",
    "claw_zero.tools",
    "claw_zero.context",
    "claw_zero.memory",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
